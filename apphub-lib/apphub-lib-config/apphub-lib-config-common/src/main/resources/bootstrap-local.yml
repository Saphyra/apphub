event:
  serviceHost: localhost:${server.port}
  processor:
    enabled: true

serviceHosts:
  frontend: localhost:3000
  adminPanel: localhost:8089
  eventGateway: localhost:8081
  skyxploreData: localhost:8091
  skyxploreGame: localhost:8095
  skyxploreLobby: localhost:8093
  storage: localhost:8099
  user: localhost:8085
  webContent: localhost:8083
  monitoring: localhost:8084
  authorization: localhost:8092
  community: localhost:8096
  training: localhost:8086
  notebook: localhost:8090
  modules: localhost:8088
  calendar: localhost:8097
  eliteBase: localhost:8087
  mainGateway: localhost:8080

authorization:
  issuer: apphub-local

spring:
  cloud:
    kubernetes:
      enabled: false
  datasource:
    username: postgres
    password: postgres
    url: jdbc:postgresql://${postgreSqlHost}:5432/apphub?ApplicationName=${spring.application.name}
    driverClassName: org.postgresql.Driver
    hikari:
      maximumPoolSize: 5
      minimumIdle: 1
      idleTimeout: 10000

eureka:
  client:
    enabled: false

encryptionStrategy: revealing