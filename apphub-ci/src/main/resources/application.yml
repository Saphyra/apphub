server:
  port: 8079

spring:
  datasource:
    username: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5432/apphub_ci
    driverClassName: org.postgresql.Driver
    hikari:
      maximumPoolSize: 3
      minimumIdle: 1
  jpa:
    properties:
      hibernate:
        default_schema: public
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

liquibase:
  schema: public
  changelog:
    location: classpath:changelog.xml

platform:
  minikubeProdServerPort: 9000
  minikubePreprodServerPort: 8999
  minikubeProdMainGatewayPort: 8060
  minikubePreprodMainGatewayPort: 8059
  minikubeDevServerPort: 9001
  minikubeTestServerPort: 8080
  localServerPort: 8080
  minikubeDynamoDbPort: 9003

  minikubeDatabasePort: 9002
  minikubeTestDatabasePort: 5432
  localDatabasePort: 5432
  localDynamoDbPort: 8000

  minikubeDatabaseName: postgres
  localDatabaseName: apphub
  prodDatabaseName: apphub_production

  integrationServer:
    name: integration-server
    port: 8072
    location: "./apphub-integration-server/target/application.jar"
    moduleName: apphub-integration-server

  productionProxy:
    name: production-proxy
    port: 9000
    location: "./apphub-proxy/target/proxy.jar"
    healthCheckPort: 8998
  preprodProxy:
    name: preprod-proxy
    port: 8999
    location: "./apphub-proxy/target/proxy.jar"
    healthCheckPort: 8997

  prodDisabledTestGroups:
    - skyxplore
    - community

  prodDisabledRoles:
    - SKYXPLORE
    - COMMUNITY

defaults:
  defaultLocale: ENGLISH
  localDeployMode: DEFAULT
  remoteDeployMode: DEFAULT
  buildThreadCountDefault: 6
  buildThreadCountSkipTests: 24
  localRunTestsThreadCount: 20
  remoteTestsThreadCount: 6
  localServiceStartupCountLimit: 5
  remoteServiceStartupCountLimit: 5
  localRunTestsPreCreateDriverCount: 0
  remoteRunTestsPreCreateDriverCount: 0
  bashFileLocation: bash
  browserStartupLimit: 3
  guiEnabled: true
  integrationRetryCount: 2

services:
  #Crucial platform
  - name: event-gateway
    port: 8081
    location: "./apphub-service/apphub-service-platform/apphub-service-platform-event_gateway/target/application.jar"
    moduleName: apphub-service-platform-event_gateway
    group: 0
    properties:
      - PSQL_HOST

  #Platform
  - name: main-gateway
    port: 8080
    location: "./apphub-service/apphub-service-platform/apphub-service-platform-main_gateway/target/application.jar"
    moduleName: apphub-service-platform-main_gateway
    group: 2
    properties:
      - AUTHORIZATION_CERTIFICATE
      - DYNAMO_DB_CONFIGURATION
  - name: scheduler
    port: 8082
    location: "./apphub-service/apphub-service-platform/apphub-service-platform-scheduler/target/application.jar"
    moduleName: apphub-service-platform-scheduler
    group: 2
  - name: admin-panel
    port: 8089
    location: "./apphub-service/apphub-service-etc/apphub-service-etc-admin_panel/target/application.jar"
    moduleName: apphub-service-etc-admin_panel
    group: 1
    properties:
      - PSQL_HOST
  - name: monitoring
    port: 8084
    location: "./apphub-service/apphub-service-platform/apphub-service-platform-monitoring/target/application.jar"
    moduleName: apphub-service-platform-monitoring
    group: 1
    properties:
      - PSQL_HOST
  - name: user
    port: 8085
    location: "./apphub-service/apphub-service-etc/apphub-service-etc-user/target/application.jar"
    moduleName: apphub-service-etc-user
    group: 1
    properties:
      - PSQL_HOST
      - DYNAMO_DB_CONFIGURATION
  - name: authorization
    port: 8092
    location: "./apphub-service/apphub-service-platform/apphub-service-platform-authorization/target/application.jar"
    moduleName: apphub-service-platform-authorization
    group: 1
    properties:
      - AUTHORIZATION_CERTIFICATE

  #Optional platform
  - name: storage
    port: 8099
    location: "./apphub-service/apphub-service-platform/apphub-service-platform-storage/target/application.jar"
    moduleName: apphub-service-platform-storage
    group: 1
    optional: true
    properties:
      - S3_CONFIGURATION
      - FTP_HOST
      - PSQL_HOST
      - DYNAMO_DB_CONFIGURATION
  - name: encryption
    port: 8098
    location: "./apphub-service/apphub-service-platform/apphub-service-platform-encryption/target/application.jar"
    moduleName: apphub-service-platform-encryption
    group: 1
    optional: true
    properties:
      - PSQL_HOST
  - name: modules
    port: 8088
    location: "./apphub-service/apphub-service-etc/apphub-service-etc-modules/target/application.jar"
    moduleName: apphub-service-etc-modules
    group: 1
    optional: true
    properties:
      - PSQL_HOST

  #SkyXplore
  - name: skyxplore-data
    port: 8091
    location: "./apphub-service/apphub-service-feature/apphub-service-feature-skyxplore/apphub-service-feature-skyxplore-data/target/application.jar"
    moduleName: apphub-service-feature-skyxplore-data
    group: 1
    optional: true
    properties:
      - PSQL_HOST
  - name: skyxplore-game
    port: 8095
    location: "./apphub-service/apphub-service-feature/apphub-service-feature-skyxplore/apphub-service-feature-skyxplore-game/target/application.jar"
    moduleName: apphub-service-feature-skyxplore-game
    group: 1
    optional: true
  - name: skyxplore-lobby
    port: 8093
    location: "./apphub-service/apphub-service-feature/apphub-service-feature-skyxplore/apphub-service-feature-skyxplore-lobby/target/application.jar"
    moduleName: apphub-service-feature-skyxplore-lobby
    group: 1
    optional: true

  #Feature
  - name: training
    port: 8086
    location: "./apphub-service/apphub-service-feature/apphub-service-feature-training/target/application.jar"
    moduleName: apphub-service-feature-training
    group: 1
    optional: true
  - name: notebook
    port: 8090
    location: "./apphub-service/apphub-service-feature/apphub-service-feature-notebook/target/application.jar"
    moduleName: apphub-service-feature-notebook
    group: 1
    optional: true
    properties:
      - PSQL_HOST
      - DYNAMO_DB_CONFIGURATION
  - name: community
    port: 8096
    location: "./apphub-service/apphub-service-feature/apphub-service-feature-community/target/application.jar"
    moduleName: apphub-service-feature-community
    group: 1
    optional: true
    properties:
      - PSQL_HOST
  - name: calendar
    port: 8097
    location: "./apphub-service/apphub-service-feature/apphub-service-feature-calendar/target/application.jar"
    moduleName: apphub-service-feature-calendar
    group: 1
    optional: true
    properties:
      - PSQL_HOST
  - name: elite-base
    port: 8087
    location: "./apphub-service/apphub-service-feature/apphub-service-feature-elite_base/target/application.jar"
    moduleName: apphub-service-feature-elite_base
    group: 1
    optional: true
    properties:
      - PSQL_HOST