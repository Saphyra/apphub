<html>
<head>
    <title>DynamoDB Settings - CI - Apphub</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>DynamoDB Settings for environment <span th:text="${environment}"></span></h1>

<h1 class="error" th:if="${error != null}" th:text="${error}"></h1>
<h1 class="success" th:if="${success != null}" th:text="${success}"></h1>

<div class="menu">
    <div>
        <a href="/settings">Back</a>
    </div>
    <form th:action="@{|/settings/dynamo-db/${environment}/delete|}" method="GET">
        <input type="checkbox" required>
        <input type="submit" value="Delete environment settings"/>
    </form>
    <form th:action="@{|/settings/dynamo-db/${environment}|}" method="POST">
        <ul>
            <li>
                <label>
                    Access key:
                    <input type="text" name="access_key_id" th:value="${access_key_id}"/>
                </label>
            </li>
            <li>
                <label>
                    Secret key:
                    <input type="text" name="secret_key" th:value="${secret_key}"/>
                </label>
            </li>
        </ul>

        <input type="submit" value="Save"/>
    </form>
</div>
</body>
</html>
