spring:
  application:
    name: scheduler
  datasource:
    initialize: false

initialDelay: 1000

interval:
  user:
    authentication:
      accessTokenCleanup: 60000
    deletion: 5000
    revoke-ban: 60000
  skyxplore:
    lobby:
      lobbyCleanup: 300000
    game:
      gameCleanup: 300000 #5 minutes
      deletion: 60000 #1 minute
  platform:
    webSocket:
      pingRequest: 30000
      connectionCleanup: 600000
  monitoring:
    aggregateSecondMetrics: 0 * * * * ? #Every minute
    aggregateMinuteMetrics: 0 0 * * * ? #Every hour
    deleteExpiredMetrics: 0 0 0 * * ? #Every day at midnight
    reportMemoryStatus: 1000
    sendCollectedMetrics: 5000
  storage:
    storedFileCleanup: 300000 #5 minutes
    fileCleanupCron: "0 0 11 1 * ?" #Every first day of month at 11AM
  eliteBase:
    processMessages: PT5S
    resetUnhandledMessages: P7D
    deleteExpiredMessages: PT1H
    orphanedRecordCleanup: 0 0 3 * * * #Every day at 3AM