server:
  port: 8087

elite-base:
  cache:
    bufferSynchronizationInterval: PT20M
    maxBufferSize: 1000000
  messageHandler:
    enabled: true
  messageExpiration: P30D
  messageProcessorBatchSize: 500
  executor:
    threadCount: 10
  messageProcessorRetryDelay: PT2M
  messageProcessorMaxRetryCount: 10
  incomingMessageCheckInterval: PT60M