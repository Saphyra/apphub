spring:
  application:
    name: user

liquibase:
  schema: apphub_user

password:
  lockAccountFailures: 3
  lockedMinutes: 60

registration:
  defaultRoles:
  - NOTEBOOK
  - SKYXPLORE
  - ACCESS
  - TRAINING
  - UTILS
  - COMMUNITY
  - CALENDAR
  - ELITE_BASE
  - TASK_MANAGER

rolesCanBeDisabled:
- NOTEBOOK
- SKYXPLORE
- TRAINING
- TEST
- UTILS
- COMMUNITY
- CALENDAR
- ELITE_BASE
- ELITE_BASE_ADMIN
- TASK_MANAGER

add-role-to-all:
  restrictedRoles:
  - ACCESS
  - ADMIN
  - ELITE_BASE_ADMIN

settings:
  calendar:
    index-view-layout: ~
    show-archived: true
  notebook:
    show-archived: true
    default-list-item-id: ~
  collapsed-modules:
    community: false
    admin-panel: false
    accounts: false
    office: false
    development-utils: false
    game: false
    training: false
    custom: false

maxNumberOfUsersFound: 100
deleteAccountBatchCount: 10