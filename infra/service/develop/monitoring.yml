apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring
  labels:
    app: monitoring
    type: spring-app
spec:
  replicas: 1
  selector:
    matchLabels:
      name: monitoring
  template:
    metadata:
      labels:
        serviceType: spring-app
        name: monitoring
    spec:
      containers:
      - name: monitoring
        image: saphyra/apphub-service-platform-monitoring:latest
        env:
        - name: SPRING_ACTIVE_PROFILE
          value: server,develop
        - name: PSQL_HOST
          valueFrom:
            secretKeyRef:
              name: psql-host
              key: PSQL_HOST
        ports:
        - containerPort: 8080
        imagePullPolicy: Never
        startupProbe:
          httpGet:
            path: /platform/health
            port: 8080
          periodSeconds: 5
          failureThreshold: 3600
        livenessProbe:
          httpGet:
            path: /platform/health
            port: 8080
          periodSeconds: 5
          failureThreshold: 1
        readinessProbe:
          httpGet:
            path: /platform/health
            port: 8080
          periodSeconds: 5
          failureThreshold: 1
        resources:
          limits:
            memory: 500Mi
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring
  labels:
    app: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 8080
  selector:
    name: monitoring